<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Coin Puzzle</title>

  <style>
    :root{
      --w: 512px;
      --gap: 8px;

      --bg: #0e3a37;
      --panel: rgba(255,255,255,.06);
      --panel2: rgba(0,0,0,.12);

      --tileBg: #0b7c74;
      --targetBg: #f2c22a;
      --targetText: #111;
      --frame: #0a2f2d;

      --btnBg: #1bc7a6;
      --btnText: #083a34;
    }

    *{ box-sizing: border-box; }

    body{
      margin:0;
      background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      color: #fff;
      display:flex;
      justify-content:center;
    }

    .app{
      width: min(var(--w), 92vw);
      padding: 14px 12px max(24px, env(safe-area-inset-bottom));
    }

    .header{
      width: 100%;
      border-radius: 12px;
      overflow:hidden;
      box-shadow: 0 6px 16px rgba(0,0,0,.25);
      margin-bottom: 12px;
    }
    .header img{
      width:100%;
      height:auto;
      display:block;
    }

    .controls{
      display:flex;
      gap: 10px;
      margin: 10px 0 10px;
    }
    button{
      flex:1;
      border:0;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 16px;
      font-weight: 700;
      background: var(--btnBg);
      color: var(--btnText);
      box-shadow: 0 6px 14px rgba(0,0,0,.25);
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:active{
      transform: translateY(1px);
      box-shadow: 0 4px 10px rgba(0,0,0,.22);
    }

/* ===== 画像ボタン用（Play / Reset） ===== */
button.imgBtn{
  padding: 0;
  background: transparent;
  box-shadow: none;
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
}

button.imgBtn img{
  width: 100%;
  height: auto;
  display: block;
}

button.imgBtn:active{
  transform: translateY(1px) scale(0.98);
}

button.imgBtn:focus-visible{
  outline: 3px solid rgba(255,255,255,.75);
  outline-offset: 2px;
}

    .statusbar{
      background: var(--panel);
      border-radius: 12px;
      padding: 10px 12px;
      margin: 0 0 12px;
      box-shadow: 0 8px 18px rgba(0,0,0,.20);
      display:grid;
      grid-template-columns: 1fr auto;
      gap: 8px 12px;
      align-items:center;
    }
    .status-left{
      display:flex;
      flex-wrap:wrap;
      gap: 10px;
      align-items:center;
      font-size: 13px;
      opacity: .95;
    }
    .chip{
      background: var(--panel2);
      border-radius: 999px;
      padding: 6px 10px;
      line-height: 1;
      white-space:nowrap;
    }
    .clear{
      font-weight: 900;
      letter-spacing: .5px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.18);
      display:none;
    }
    .clear.show{ display:inline-flex; }

    .status-right{
      display:flex;
      gap: 10px;
      align-items:center;
    }
    select{
      border: 0;
      border-radius: 10px;
      padding: 8px 10px;
      background: rgba(255,255,255,.10);
      color:#fff;
      font-weight: 700;
      cursor:pointer;
      outline:none;
    }
    option{ color:#111; }

    /* 盤面ラッパー（CLEARオーバーレイを重ねる） */
    .boardWrap{
      position: relative;
    }

    .board{
      width: 100%;
      display:grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: var(--gap);
      background: rgba(0,0,0,.08);
      padding: var(--gap);
      border-radius: 14px;
      box-shadow: 0 10px 24px rgba(0,0,0,.28);
    }

    /* 左上角（画像） */
    .corner{
      background: rgba(255,255,255,.08);
      border-radius: 12px;
      min-height: 70px;
      padding: 6px;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.08);
      user-select:none;
      overflow:hidden;
    }
    .corner img{
      width: 100%;
      height: 100%;
      object-fit: contain;    /* 正方形キャンバスなら綺麗に収まる */
      display:block;
      border-radius: 10px;
      pointer-events:none;
    }

    .target{
      background: var(--targetBg);
      color: var(--targetText);
      border-radius: 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 900;
      font-size: 34px;
      letter-spacing: .5px;
      box-shadow: inset 0 0 0 3px rgba(0,0,0,.06);
      user-select:none;
    }

    .cell{
      background: var(--frame);
      border-radius: 12px;
      padding: 6px;
      display:flex;
      align-items:center;
      justify-content:center;
      aspect-ratio: 1 / 1;
    }

    .tile{
      width:100%;
      height:100%;
      border-radius: 10px;
      background: var(--tileBg);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      cursor:pointer;
      position:relative;

      outline:none;
      user-select:none;
      -webkit-user-select:none;
      -webkit-tap-highlight-color: transparent;
    }

    .tile img{
      width: 92%;
      height: auto;
      display:block;
      pointer-events:none;
    }

    .tile:active{
      transform: scale(0.995);
      filter: brightness(0.98);
    }

    .tile:focus{ outline:none; }
    .tile:focus-visible{
      outline: 3px solid rgba(255,255,255,.75);
      outline-offset: 2px;
    }

    /* CLEAR オーバーレイ */
    .overlay{
      position:absolute;
      inset: 0;
      border-radius: 14px;
      display:none;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,.58);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 5;
      user-select:none;
      padding: 12px;
    }
    .overlay.show{
      display:flex;
      animation: overlayFade .35s ease-out both;
    }
    .overlayCard{
      width: min(390px, 92%);
      max-height: 95%;
      padding: 16px 18px 18px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,.24), rgba(255,255,255,.16));
      box-shadow: 0 20px 44px rgba(0,0,0,.42);
      border: 2px solid rgba(255,255,255,.16);
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      transform-origin:center center;
      animation: cardPop .55s cubic-bezier(.2,.9,.2,1.08) both;
    }
    .clearLead{
      font-size: clamp(20px, 5vw, 30px);
      font-weight: 900;
      letter-spacing: .06em;
      color: #fff7a8;
      text-shadow: 0 2px 0 rgba(0,0,0,.15), 0 0 18px rgba(255, 227, 84, .45);
      margin: 0 0 8px;
      font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN W4", "Yu Gothic", "Meiryo", sans-serif;
    }
    .clearImg{
      width: min(420px, 92vw);
      max-height: min(310px, 58vw);
      max-width: 100%;
      height: auto;
      display:block;
      margin: 0 auto;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.22));
      animation: clearBounce .7s .08s cubic-bezier(.18,.9,.28,1.2) both;
    }
    .playAgainBtn{
      display:block;
      width: 100%;
      margin-top: 16px;
      padding: 14px 16px;
      min-height: 56px;
      font-size: clamp(18px, 4.5vw, 24px);
      font-weight: 900;
      color: #083a34;
      background: linear-gradient(180deg, #41dfc7, #24c0aa);
      border-radius: 16px;
      border: 2px solid rgba(255,255,255,.36);
      box-shadow: 0 10px 18px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.25);
      transform: translateY(8px);
      opacity: 0;
      animation: buttonRise .42s .35s ease-out forwards;
    }
    .playAgainBtn:hover{ filter: brightness(1.03); }
    .playAgainBtn:focus-visible{ outline: 3px solid #fff; outline-offset: 3px; }
    @keyframes overlayFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes cardPop {
      0% { opacity: 0; transform: scale(.82) translateY(16px); }
      65% { opacity: 1; transform: scale(1.04) translateY(0); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes clearBounce {
      0% { opacity: 0; transform: scale(.7) rotate(-5deg); }
      55% { opacity: 1; transform: scale(1.08) rotate(2deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes buttonRise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }


    @media (max-width: 420px){
      .target{ font-size: 28px; }
      button{ font-size: 15px; }
    }
.copyright{
  margin: 14px 0 0;
  text-align: center;
  font-size: 14px;
  color: rgba(255,255,255,.6);
}

.copyright .note{
  display: block;
  margin-top: 2px;
  font-size: 13px;
  color: rgba(255,255,255,.45);
}


/* ===== タイトル枠内のinfo（画像全体 + 透明な操作領域） ===== */
.titleRow { position:relative; width:100%; margin:4px 0 12px; }
.newTitle { display:block; width:100%; height:auto; }
button.infoIcon {
  position:absolute; right:4.3%; top:18%;
  width:17%; height:62%; min-height:0;
  padding:0 !important; margin:0; display:block;
  background:transparent !important; border:0;
  border-radius:50%; box-shadow:none !important;
  cursor:pointer; touch-action:manipulation;
}
button.infoIcon:focus-visible {outline:3px solid white; outline-offset:2px;}
/* ===== 説明画面・日本語UI・Safari表示調整 ===== */
[hidden] {display:none !important;}
.statusbar {grid-template-columns:1fr; gap:10px;}
.status-left {font-size:16px; font-weight:800; gap:8px;}
.chip {padding:9px 11px; line-height:1.2;}
.status-right {width:100%;}
#levelSelect {width:100%; min-height:52px; font-size:20px; font-weight:900; background:#ffffff; color:#10423b; border:2px solid #1bc7a6; padding:9px 14px;}
#levelSelect:focus-visible,.backGameBtn:focus-visible,.infoIcon:focus-visible {outline:3px solid #fff; outline-offset:3px;}
.aboutCrop {width:100%; aspect-ratio:1125 / 1760; position:relative; overflow:hidden; border-radius:12px;}
.aboutImage {display:block; position:absolute; top:0; left:0; width:100%; height:auto;}
button.backGameBtn {display:block; width:92%; margin:12px auto 16px; min-height:60px; font-size:clamp(19px,5vw,25px); font-weight:900; color:white; background:linear-gradient(#2ce0e5,#00b8cb); border:2px solid #35f0ef; box-shadow:0 5px 10px rgba(0,0,0,.3); position:relative; z-index:1;}
#infoView {padding-bottom:env(safe-area-inset-bottom);}
@media(max-width:420px) { .status-left {font-size:15px;} #levelSelect {font-size:19px;} }


/* ===== 公開版：3つの大きな難易度ボタン ===== */
.app { width:min(560px, 100%); padding:10px 8px max(24px,env(safe-area-inset-bottom)); }
.controls { margin:8px 0 10px; }
.difficulty { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; margin:0 0 12px; }
button.difficultyBtn {
  min-width:0; min-height:61px; padding:10px 2px;
  font-family:"Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN W4", "UD デジタル 教科書体 NP-B", "Yu Gothic", "Meiryo", sans-serif;
  font-size:clamp(18px,4.8vw,27px); font-weight:900; line-height:1.2;
  color:#242424; border:3px solid transparent; border-radius:12px;
  box-shadow:0 3px 6px rgba(0,0,0,.18);
  white-space:nowrap; touch-action:manipulation;
}
button.difficultyBtn.easy { background:#ffc72b; }
button.difficultyBtn.normal { background:#91d356; }
button.difficultyBtn.hard { background:#ce9afa; }
button.difficultyBtn.is-selected {
  border-color:#ffffff;
  box-shadow:0 0 0 3px #145b52, 0 4px 9px rgba(0,0,0,.32);
}
button.difficultyBtn:focus-visible { outline:3px solid #fff; outline-offset:4px; }
@media (max-width:360px) {
  .difficulty { gap:6px; }
  button.difficultyBtn { font-size:clamp(16px,4.8vw,19px); min-height:57px; border-radius:9px; }
}

  </style>
</head>

<body>
  <div class="app">
    <main id="gameView">
    <div class="titleRow">
      <img class="newTitle" src="images/coin_title_info.png" alt="PowerPoint Webアプリ コインパズル">
      <button type="button" id="btnInfo" class="infoIcon" aria-label="この教材について・遊び方を開く"></button>
    </div>

    <div class="controls">
  <button id="btnPlay" type="button" class="imgBtn" aria-label="Play">
    <img src="images/btn_play.png" alt="Play">
  </button>

  <button id="btnReset" type="button" class="imgBtn" aria-label="Reset">
    <img src="images/btn_reset.png" alt="Reset">
  </button>
</div>


    <div class="difficulty" role="group" aria-label="むずかしさをえらぶ">
      <button type="button" class="difficultyBtn easy" data-level="easy" aria-pressed="false">かんたん</button>
      <button type="button" class="difficultyBtn normal is-selected" data-level="normal" aria-pressed="true">ふつう</button>
      <button type="button" class="difficultyBtn hard" data-level="hard" aria-pressed="false">むずかしい</button>
    </div>

    <div class="boardWrap">
      <div class="overlay" id="clearOverlay" aria-hidden="true">
        <div class="overlayCard">
          <div class="clearLead">せいかい！</div>
          <!-- ★ ここが画像CLEAR -->
          <img src="images/clear.png" alt="やったー！" class="clearImg">
          <button id="btnPlayAgain" class="playAgainBtn" type="button">もう一度あそぶ</button>
        </div>
      </div>

      <div class="board" id="board">
        <!-- ★ 左上角を画像で埋める -->
        <div class="corner">
          <img src="images/corner.png" alt="Target Sum">
        </div>

        <div class="target" id="tTop0">-</div>
        <div class="target" id="tTop1">-</div>
        <div class="target" id="tTop2">-</div>

        <div class="target" id="tLeft0">-</div>
        <div class="cell"><div class="tile" role="button" tabindex="0" data-i="0"><img alt="" id="img0"></div></div>
        <div class="cell"><div class="tile" role="button" tabindex="0" data-i="1"><img alt="" id="img1"></div></div>
        <div class="cell"><div class="tile" role="button" tabindex="0" data-i="2"><img alt="" id="img2"></div></div>

        <div class="target" id="tLeft1">-</div>
        <div class="cell"><div class="tile" role="button" tabindex="0" data-i="3"><img alt="" id="img3"></div></div>
        <div class="cell"><div class="tile" role="button" tabindex="0" data-i="4"><img alt="" id="img4"></div></div>
        <div class="cell"><div class="tile" role="button" tabindex="0" data-i="5"><img alt="" id="img5"></div></div>

        <div class="target" id="tLeft2">-</div>
        <div class="cell"><div class="tile" role="button" tabindex="0" data-i="6"><img alt="" id="img6"></div></div>
        <div class="cell"><div class="tile" role="button" tabindex="0" data-i="7"><img alt="" id="img7"></div></div>
        <div class="cell"><div class="tile" role="button" tabindex="0" data-i="8"><img alt="" id="img8"></div></div>
      </div>
    </div>
      <footer class="copyright">
        © 2026 Michio Inaba / Coin Puzzle
        <span class="note">PowerPoint × Web App</span>
      </footer>

</main>
    <section id="infoView" hidden aria-label="この教材について・遊び方・利用について">
      <div class="aboutCrop"><img class="aboutImage" src="images/coin_info.png" alt="この教材を作った人、学び方・遊び方、利用について、著作権表示"></div>
      <button type="button" id="btnBackGame" class="backGameBtn">← ゲームにもどる</button>
    </section>
</div>

  <script>
    const IMG = {
      empty: "images/coin_empty.png",
      1: "images/coin_1.png",
      5: "images/coin_5.png",
      10: "images/coin_10.png",
      50: "images/coin_50.png",
      100: "images/coin_100.png",
      500: "images/coin_500.png",
    };

    const ORDER = [null, 1, 5, 10, 50, 100, 500];

    const imgEls = Array.from({length:9}, (_,i)=>document.getElementById("img"+i));
    const topEls = [0,1,2].map(i => document.getElementById("tTop"+i));
    const leftEls = [0,1,2].map(i => document.getElementById("tLeft"+i));

    let selectedLevel = "normal";
    const clearOverlay = document.getElementById("clearOverlay");

    
    let clearShowTimer = null;
    const CLEAR_SHOW_DELAY = 650;   // 正解後、表示するまで(ms)
    let player = Array(9).fill(null);
    let answer = Array(9).fill(1);
    let targetTop = [0,0,0];
    let targetLeft = [0,0,0];

    function coinsByLevel(level){
      if(level === "easy")   return [1,5,10,50];
      if(level === "hard")   return [1,5,10,50,100,100,500,500];
      return [1,5,10,50,100,500];
    }

    function setImg(i, value){
      imgEls[i].src = (value === null) ? IMG.empty : IMG[value];
      imgEls[i].alt = (value === null) ? "未選択" : (value + "円");
    }

    function renderPlayer(){
      for(let i=0;i<9;i++) setImg(i, player[i]);
    }

    function calcTargetsFromAnswer(){
      targetTop = [0,0,0];
      for(let c=0;c<3;c++){
        targetTop[c] = answer[c] + answer[c+3] + answer[c+6];
      }
      targetLeft = [0,0,0];
      for(let r=0;r<3;r++){
        const idx = r*3;
        targetLeft[r] = answer[idx] + answer[idx+1] + answer[idx+2];
      }
    }

    function renderTargets(){
      topEls.forEach((el,i)=> el.textContent = targetTop[i]);
      leftEls.forEach((el,i)=> el.textContent = targetLeft[i]);
    }

    function randCoin(level){
      const pool = coinsByLevel(level);
      return pool[Math.floor(Math.random()*pool.length)];
    }

    function resetClearUI(){
      clearOverlay.classList.remove("show");
      clearOverlay.setAttribute("aria-hidden","true");
      if(clearShowTimer){ clearTimeout(clearShowTimer); clearShowTimer=null; }
    }

    function showClearOverlayDelayed(){
      if(clearShowTimer || clearOverlay.classList.contains("show")) return;
      clearShowTimer = setTimeout(()=>{
        clearOverlay.classList.add("show");
        clearOverlay.setAttribute("aria-hidden","false");
        clearShowTimer = null;
        // 「もう一度あそぶ」を押すまで表示を維持する。
        document.getElementById("btnPlayAgain").focus();
      }, CLEAR_SHOW_DELAY);
    }

    function newPuzzle(){
      const level = selectedLevel;

      answer = Array.from({length:9}, () => randCoin(level));
      calcTargetsFromAnswer();
      renderTargets();

      player = Array(9).fill(null);
      renderPlayer();

      resetClearUI();
    }

    function resetPuzzle(){
      player = Array(9).fill(null);
      renderPlayer();

      resetClearUI();
    }

    function nextValue(v){
      const idx = ORDER.indexOf(v);
      if(idx === -1) return 1;
      if(idx === 0) return 1;
      if(idx === ORDER.length-1) return 1;
      return ORDER[idx+1];
    }

    function currentSums(){
      const val = i => (player[i] ?? 0);

      const top = [0,0,0];
      for(let c=0;c<3;c++){
        top[c] = val(c) + val(c+3) + val(c+6);
      }

      const left = [0,0,0];
      for(let r=0;r<3;r++){
        const idx = r*3;
        left[r] = val(idx) + val(idx+1) + val(idx+2);
      }
      return { top, left };
    }

    function checkClear(){
      if(topEls[0].textContent === "-") return false;

      const sums = currentSums();
      const okTop = sums.top.every((v,i)=> v === targetTop[i]);
      const okLeft = sums.left.every((v,i)=> v === targetLeft[i]);

      const cleared = okTop && okLeft;

      if(cleared){
        showClearOverlayDelayed();
      }else{
          clearOverlay.classList.remove("show");
        clearOverlay.setAttribute("aria-hidden","true");
      }
      return cleared;
    }

    function handleTileActivate(i){
      player[i] = nextValue(player[i]);
      setImg(i, player[i]);

      checkClear();
    }

    document.querySelectorAll(".tile").forEach(tile=>{
      tile.addEventListener("click", ()=>{
        const i = Number(tile.dataset.i);
        handleTileActivate(i);
      });

      tile.addEventListener("keydown", (e)=>{
        if(e.key === "Enter" || e.key === " "){
          e.preventDefault();
          const i = Number(tile.dataset.i);
          handleTileActivate(i);
        }
      });
    });


    // クリア画面は自動で閉じず、ボタンから次の問題を開始する。
    document.getElementById("btnPlayAgain").addEventListener("click", newPuzzle);

    document.getElementById("btnPlay").addEventListener("click", newPuzzle);
    document.getElementById("btnReset").addEventListener("click", resetPuzzle);

    document.querySelectorAll(".difficultyBtn").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedLevel = btn.dataset.level;
        document.querySelectorAll(".difficultyBtn").forEach(item => {
          const selected = item === btn;
          item.classList.toggle("is-selected", selected);
          item.setAttribute("aria-pressed", String(selected));
        });
        newPuzzle();
      });
    });

    const gameView = document.getElementById("gameView");
    const infoView = document.getElementById("infoView");
    const btnInfo = document.getElementById("btnInfo");
    const btnBackGame = document.getElementById("btnBackGame");
    btnInfo.addEventListener("click", () => {
      gameView.hidden = true;
      infoView.hidden = false;
      window.scrollTo(0, 0);
      btnBackGame.focus({preventScroll:true});
    });
    btnBackGame.addEventListener("click", () => {
      infoView.hidden = true;
      gameView.hidden = false;
      window.scrollTo(0, 0);
      btnInfo.focus({preventScroll:true});
    });

    renderPlayer();

  </script>
</body>
</html>
